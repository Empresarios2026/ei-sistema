<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Catálogo — Empresarios Inmobiliarios</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#111; font-family:'Arial',sans-serif; }
#loading { position:fixed; inset:0; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; }
.load-dot { width:10px; height:10px; background:#CE011F; border-radius:50%; animation:pulse 1s infinite; }
.load-text { color:#666; font-size:12px; margin-top:16px; letter-spacing:1px; text-transform:uppercase; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:.5} }
#slider { position:relative; width:100%; height:100%; display:none; align-items:center; justify-content:center; }
.slide-wrap { flex-shrink:0; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.5); }
.slide { display:none; width:100%; height:100%; position:absolute; top:0; left:0; }
.slide.active { display:flex; }
.cover { width:100%; height:100%; display:flex; flex-direction:column; background:#fff; }
.cover-bar { background:#CE011F; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.cover-bar-brand { font-size:11px; color:#fff; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
.cover-bar-slogan { font-size:9px; color:rgba(255,255,255,.75); font-style:italic; }
.cover-body { flex:1; display:flex; overflow:hidden; min-height:0; }
.cover-img { width:55%; flex-shrink:0; overflow:hidden; }
.cover-img img { width:100%; height:100%; object-fit:cover; display:block; }
.cover-info { flex:1; padding:14px 16px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
.cover-op { display:inline-block; background:rgba(206,1,31,.1); color:#CE011F; border:1px solid rgba(206,1,31,.25); border-radius:20px; padding:3px 10px; font-size:9px; font-weight:700; text-transform:uppercase; margin-bottom:6px; }
.cover-titulo { font-size:16px; font-weight:900; color:#1a1a1a; line-height:1.25; margin-bottom:5px; }
.cover-precio { font-size:20px; font-weight:700; color:#CE011F; margin-bottom:10px; }
.cover-stats { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.stat { background:#f5f5f5; border-radius:6px; padding:5px 8px; text-align:center; }
.stat-val { font-size:13px; font-weight:700; color:#1a1a1a; line-height:1; }
.stat-lbl { font-size:7px; color:#999; text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }
.cover-footer { border-top:1px solid #eee; padding-top:8px; margin-top:6px; flex-shrink:0; }
.cover-asesor { font-size:11px; font-weight:700; color:#1a1a1a; }
.cover-tel { font-size:10px; color:#888; margin-top:2px; }
.foto-slide { width:100%; height:100%; position:relative; background:#111; display:flex; align-items:center; justify-content:center; }
.foto-slide img { width:100%; height:100%; object-fit:cover; display:block; }
.watermark { position:absolute; bottom:50px; right:12px; background:rgba(0,0,0,.6); border-radius:6px; padding:5px 10px; font-size:10px; font-weight:700; color:#fff; display:flex; align-items:center; gap:5px; }
.wm-dot { width:7px; height:7px; background:#CE011F; border-radius:50%; flex-shrink:0; }
.foto-counter { position:absolute; top:12px; right:12px; background:rgba(0,0,0,.55); border-radius:20px; padding:4px 10px; font-size:10px; color:#fff; font-weight:600; }
.btn-nav { position:fixed; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.9); border:none; font-size:22px; color:#1a1a1a; cursor:pointer; z-index:100; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 12px rgba(0,0,0,.2); -webkit-appearance:none; outline:none; }
#btn-prev { left:10px; }
#btn-next { right:10px; }
#dots { position:fixed; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:100; }
.dot { width:8px; height:8px; border-radius:4px; background:rgba(255,255,255,.35); cursor:pointer; transition:all .25s; border:none; padding:0; -webkit-appearance:none; }
.dot.active { width:22px; background:#CE011F; }
#error { position:fixed; inset:0; background:#111; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; padding:40px; }
#error h2 { font-size:18px; margin-bottom:10px; }
#error p { font-size:13px; color:#888; line-height:1.6; }
</style>
</head>
<body>
<div id="loading">
  <div class="load-dot"></div>
  <div class="load-text">Cargando...</div>
</div>
<div id="slider">
  <div class="slide-wrap" id="wrap"></div>
</div>
<button class="btn-nav" id="btn-prev">&#8249;</button>
<button class="btn-nav" id="btn-next">&#8250;</button>
<div id="dots"></div>
<div id="error">
  <h2>Catalogo no disponible</h2>
  <p>Este catalogo puede haber expirado o el enlace es incorrecto.<br>Contacta al asesor para obtener un nuevo enlace.</p>
</div>
<script>
var SB_URL = 'https://crnvavaaxsoesabipcho.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNybnZhdmFheHNvZXNhYmlwY2hvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MTc1OTQsImV4cCI6MjA4OTQ5MzU5NH0.P00sHTHvoZBvaL7WnAGdHWQqu9kUvXexLQ9B0IH1dR4';
var cur = 0;
var slides = [];
var dotsEl = [];

function resize() {
  var wrap = document.getElementById('wrap');
  if (!wrap) return;
  var vw = window.innerWidth, vh = window.innerHeight, r = 16/9, w, h;
  if (vw/vh > r) { h = vh * 0.94; w = h * r; } else { w = vw * 0.98; h = w / r; }
  wrap.style.width = Math.round(w) + 'px';
  wrap.style.height = Math.round(h) + 'px';
}

function goTo(n) {
  if (n < 0 || n >= slides.length) return;
  slides[cur].classList.remove('active');
  if (dotsEl[cur]) dotsEl[cur].classList.remove('active');
  cur = n;
  slides[cur].classList.add('active');
  if (dotsEl[cur]) dotsEl[cur].classList.add('active');
}

function buildDots(total) {
  var c = document.getElementById('dots');
  c.innerHTML = '';
  dotsEl = [];
  for (var i = 0; i < total; i++) {
    var b = document.createElement('button');
    b.className = 'dot' + (i === 0 ? ' active' : '');
    (function(idx) { b.addEventListener('click', function() { goTo(idx); }); })(i);
    c.appendChild(b);
    dotsEl.push(b);
  }
}

function buildCatalogo(data) {
  var wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  slides = [];
  cur = 0;

  var fotos = data.fotos_urls || [];
  var foto1 = fotos.length ? fotos[0] : '';

  // Slide 1 - Portada
  var p = document.createElement('div');
  p.className = 'slide active';
  p.innerHTML = '<div class="cover">' +
    '<div class="cover-bar"><div class="cover-bar-brand">Empresarios Inmobiliarios</div><div class="cover-bar-slogan">Construimos Patrimonio</div></div>' +
    '<div class="cover-body">' +
      (foto1 ? '<div class="cover-img"><img src="' + foto1 + '" alt="foto"></div>' : '') +
      '<div class="cover-info"><div>' +
        '<div class="cover-op">' + (data.operacion || 'En Venta') + '</div>' +
        '<div class="cover-titulo">' + (data.tipo || '') + (data.ubicacion ? '<br><span style="font-size:12px;font-weight:400;color:#888;">' + data.ubicacion + '</span>' : '') + '</div>' +
        (data.precio ? '<div class="cover-precio">USD ' + Number(data.precio).toLocaleString() + '</div>' : '') +
        '<div class="cover-stats">' +
          (data.area ? '<div class="stat"><div class="stat-val">' + data.area + '</div><div class="stat-lbl">m2 Area</div></div>' : '') +
          (data.dorms ? '<div class="stat"><div class="stat-val">' + data.dorms + '</div><div class="stat-lbl">Dorms</div></div>' : '') +
          (data.banos ? '<div class="stat"><div class="stat-val">' + data.banos + '</div><div class="stat-lbl">Banos</div></div>' : '') +
          (data.cocheras ? '<div class="stat"><div class="stat-val">' + data.cocheras + '</div><div class="stat-lbl">Cocheras</div></div>' : '') +
        '</div>' +
      '</div>' +
      (data.descripcion ? (function(){
        var lines = data.descripcion.split('\n').filter(function(l){return l.trim();});
        var html = '';
        for(var li=0;li<lines.length;li++){
          var line = lines[li];
          var isBullet = line.indexOf('•') >= 0;
          var txt = line.replace(/^[•]\s*/,'').trim();
          if(!txt) continue;
          if(isBullet){
            html += '<div style="display:flex;gap:6px;margin-bottom:4px;align-items:flex-start;"><span style="color:#CE011F;flex-shrink:0;margin-top:1px;">•</span><span style="font-size:10px;color:#333;line-height:1.5;">'+txt+'</span></div>';
          } else {
            html += '<p style="font-size:10px;color:#555;line-height:1.6;margin-bottom:8px;font-style:italic;">'+txt+'</p>';
          }
        }
        return '<div style="margin-bottom:8px;">'+html+'</div>';
      })() : '') +
      '<div class="cover-footer"><div class="cover-asesor">' + (data.asesor || 'Empresarios Inmobiliarios') + '</div><div class="cover-tel">Tel: ' + (data.asesor_tel || '940 916 247') + '</div></div>' +
      '</div></div></div>';
  wrap.appendChild(p);
  slides.push(p);

  // Slide 2 - Caracteristicas
  // Slides de fotos

  for (var i = 0; i < fotos.length; i++) {
    var s = document.createElement('div');
    s.className = 'slide';
    s.innerHTML = '<div class="foto-slide"><img src="' + fotos[i] + '" alt="Foto"><div class="watermark"><div class="wm-dot"></div>Empresarios Inmobiliarios</div><div class="foto-counter">' + (i+1) + ' / ' + fotos.length + '</div></div>';
    wrap.appendChild(s);
    slides.push(s);
  }

  buildDots(slides.length);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('slider').style.display = 'flex';
  setTimeout(resize, 50);
  window.addEventListener('resize', resize);
  document.getElementById('btn-prev').addEventListener('click', function() { goTo(cur - 1); });
  document.getElementById('btn-next').addEventListener('click', function() { goTo(cur + 1); });
  var tx = 0;
  document.addEventListener('touchstart', function(e) { tx = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e) { var d = tx - e.changedTouches[0].clientX; if (Math.abs(d) > 40) goTo(d > 0 ? cur+1 : cur-1); }, {passive:true});
}

function showError() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
}

function getParam(name) {
  var s = window.location.search.substring(1).split('&');
  for (var i = 0; i < s.length; i++) { var kv = s[i].split('='); if (decodeURIComponent(kv[0]) === name) return decodeURIComponent(kv[1] || ''); }
  return null;
}

var catId = getParam('id');
if (!catId) {
  showError();
} else {
  var t = setTimeout(showError, 12000);
  fetch(SB_URL + '/rest/v1/ei_catalogos?id=eq.' + catId + '&select=*', {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    clearTimeout(t);
    if (!data || !data.length) { showError(); return; }
    var cat = data[0];
    if (cat.fotos_urls && typeof cat.fotos_urls === 'string') {
      try { cat.fotos_urls = JSON.parse(cat.fotos_urls); } catch(e) { cat.fotos_urls = []; }
    }
    if (!cat.fotos_urls || !cat.fotos_urls.length) { showError(); return; }
    buildCatalogo(cat);
  })
  .catch(function() { clearTimeout(t); showError(); });
}
</script>
</body>
</html>
